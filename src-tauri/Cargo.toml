[package]
name = "audio-splitter"
version = "0.1.0"
edition = "2021"

[lib]
name = "audio_splitter_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.18"
rtrb = "0.4"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
lto = "thin"
